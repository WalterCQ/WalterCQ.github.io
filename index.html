<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liu Zhenyu Terminal Resume</title>
    <style>
        /* 核心重置与背景 */
        body {
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
            color: #c9d1d9;
        }

        /* 终端窗口外壳 */
        .terminal-window {
            width: 85%;
            max-width: 900px;
            height: 85vh;
            background-color: #161b22;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px #30363d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部控制栏 */
        .terminal-header {
            background-color: #21262d;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .buttons { display: flex; gap: 8px; }
        .button { width: 12px; height: 12px; border-radius: 50%; }
        .close { background-color: #ff5f56; }
        .minimize { background-color: #ffbd2e; }
        .maximize { background-color: #27c93f; }

        .title {
            color: #8b949e;
            margin: 0 auto;
            font-size: 13px;
            transform: translateX(-24px);
        }

        /* 终端内容区 */
        .terminal-body {
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 15px;
            line-height: 1.6;
        }

        /* 命令行提示符 */
        .prompt-line {
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .user { color: #79c0ff; font-weight: bold; }
        .machine { color: #a5d6ff; }
        .path { color: #d2a8ff; font-weight: bold; }
        .symbol { color: #8b949e; margin-right: 8px;}
        .command { color: #3fb950; font-weight: bold; }

        /* YAML 语法高亮配色 */
        pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font-family: inherit; }
        .yaml-key { color: #ff7b72; font-weight: bold; }
        .yaml-string { color: #a5d6ff; }
        .yaml-dash { color: #d2a8ff; font-weight: bold; }

        /* 光标闪烁动画 */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background-color: #c9d1d9;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
            margin-left: 4px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 滚动条美化 */
        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-track { background: transparent; }
        .terminal-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    </style>
</head>
<body>

<div class="terminal-window">
    <div class="terminal-header">
        <div class="buttons">
            <div class="button close"></div>
            <div class="button minimize"></div>
            <div class="button maximize"></div>
        </div>
        <div class="title">walter@github-pages: ~/resume</div>
    </div>
    <div class="terminal-body" id="terminal-body">
        <div class="prompt-line">
            <span class="user">walter</span><span class="machine">@github-pages</span><span class="symbol">:</span><span class="path">~/resume</span><span class="symbol">$</span>
            <span class="command" id="typewriter"></span><span class="cursor" id="cursor"></span>
        </div>
        <div id="output" style="display: none;"></div>
    </div>
</div>

<script>
    // 完整的 YAML 简历数据
    const resumeData = `---

  - company: "China Telecom Chongqing IDC"

    // 语法高亮（带光标）
    function escapeHTML(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function highlightYAML(text) {
        return escapeHTML(text)
            .replace(/"(.*?)"/g, '"<span class="yaml-string">$1</span>"') 
            .replace(/^( *)([\w_]+):/gm, '$1<span class="yaml-key">$2</span>:')
            .replace(/^( *)- /gm, '$1<span class="yaml-dash">-</span> ');
    }

    const commandText = "cat resume.yaml";
    const typewriterEl = document.getElementById("typewriter");
    const outputEl = document.getElementById("output");
    const cursor = document.getElementById("cursor");
    let i = 0;
    let j = 0;

    function typeWriter() {
        if (i < commandText.length) {
            typewriterEl.innerHTML += commandText.charAt(i);
            i++;
            setTimeout(typeWriter, 80); 
        } else {
            // 命令输入完成后，开始流式输出内容
            setTimeout(() => {
                cursor.style.display = 'none'; 
                outputEl.style.display = 'block';
                
                // 先设置基础结构
                outputEl.innerHTML = '<pre id="stream-content"></pre><span class="cursor" id="stream-cursor"></span>';
                
                const streamContent = document.getElementById("stream-content");
                const streamCursor = document.getElementById("stream-cursor");
                let renderedText = '';
                
                // 流式输出函数
                function streamOutput() {
                    if (j < resumeData.length) {
                        const char = resumeData.charAt(j);
                        renderedText += char;
                        streamContent.innerHTML = highlightYAML(renderedText);
                        
                        j++;
                        
                        // 根据内容调整速度，模拟人类思考节奏
                        const delay = char === '\n' ? 15 : 
                                     char === '-' || char === ':' ? 20 :
                                     Math.random() > 0.95 ? 30 : 5;
                        
                        setTimeout(streamOutput, delay);
                    } else {
                        // 输出完成
                        streamCursor.style.display = 'none';
                        
                        // 追加新提示符
                        outputEl.innerHTML += `
                            <div class="prompt-line" style="margin-top: 16px;">
                                <span class="user">walter</span><span class="machine">@github-pages</span><span class="symbol">:</span><span class="path">~/resume</span><span class="symbol">$</span>
                                <span class="cursor"></span>
                            </div>
                        `;
                        
                        // 自动滚动到底部
                        const terminalBody = document.getElementById('terminal-body');
                        terminalBody.scrollTop = terminalBody.scrollHeight;
                    }
                }
                
                streamOutput();
                
            }, 400);
        }
    }

    window.onload = () => setTimeout(typeWriter, 500);
</script>

</body>
</html>
